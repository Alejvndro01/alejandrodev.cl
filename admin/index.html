  <style>
    * { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F7F4EC;
      color: #0A192F;
    }

    .bg-paper-texture {
      background-color: #F7F4EC;
      background-image: radial-gradient(rgba(10, 25, 47, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .paper-card {
      background: #FAF7F0;
      border: 1px solid #E2DAC9;
      box-shadow: 0 4px 20px rgba(10, 25, 47, 0.04);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .paper-card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(10, 25, 47, 0.08);
      border-color: #0A192F;
    }

    .tape-accent {
      position: absolute;
      background: #163359;
      box-shadow: 0 2px 6px rgba(10, 25, 47, 0.3);
      transform: rotate(-10deg);
      border-radius: 2px;
      z-index: 10;
    }

    .btn-navy {
      background: #0A192F;
      color: #F7F4EC;
      border: 1px solid #0A192F;
      transition: all 0.25s ease;
    }
    .btn-navy:hover {
      background: #1A365D;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(10, 25, 47, 0.18);
    }

    .btn-outline-navy {
      border: 1.5px solid #0A192F;
      color: #0A192F;
      background: transparent;
      transition: all 0.25s ease;
    }
    .btn-outline-navy:hover {
      background: #0A192F;
      color: #F7F4EC;
      transform: translateY(-1px);
    }

    .form-input {
      background: #FFFFFF;
      border: 1px solid #D6CEBE;
      color: #0A192F;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #0A192F;
      outline: none;
      box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.08);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #F7F4EC; }
    ::-webkit-scrollbar-thumb { background: #D0C6B4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #0A192F; }
  </style>
</head>

    function calculateFinancials(client) {
      let totalContract = client.pricePlan;
      if (client.hasDomainCl) totalContract += 10900;
      if (client.upsellDelivery) totalContract += 40000;
      if (client.upsellOnlinePay) totalContract += 80000;

      let amountPaid = 0;
      if (client.paymentMethod === "CONTADO") {
        amountPaid = (client.paidFirstHalf && client.paidSecondHalf) ? totalContract : (client.paidFirstHalf ? totalContract * 0.5 : 0);
      } else {
        const half = totalContract / 2;
        if (client.paidFirstHalf) amountPaid += half;
        if (client.paidSecondHalf) amountPaid += half;
      }

      const pendingBalance = Math.max(0, totalContract - amountPaid);
      return { totalContract, amountPaid, pendingBalance };
    }

                  </div>

                  {/* Bloque 2: Plan y Modalidad de Pago */}
                  <div>
                    <h4 class="font-serif-brand font-bold text-navy-900 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-paper-border">
                      2. Planes y Opciones de Pago (Cláusulas 2 y 3)
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                      <div>
                        <label class="block font-semibold mb-1 text-navy-900">Plan Contratado</label>
                        <select 
                          value={formData.plan}
                          onChange={e => setFormData({...formData, plan: e.target.value})}
                          class="w-full form-input p-2 rounded-lg text-xs font-medium"
                        >
                          <option value="PREMIUM">Plan Premium ($250.000 CLP - Panel PRO)</option>
                          <option value="ESENCIAL">Plan Esencial ($120.000 CLP - Config inicial)</option>
                        </select>
                      </div>
                      <div>
                        <label class="block font-semibold mb-1 text-navy-900">Modalidad de Pago Acordada</label>
                        <select 
                          value={formData.paymentMethod}
                          onChange={e => setFormData({...formData, paymentMethod: e.target.value})}
                          class="w-full form-input p-2 rounded-lg text-xs font-medium"
                        >
                          <option value="DOS_CUOTAS">2 Cuotas Directas (50% anticipo / 50% entrega)</option>
                          <option value="CONTADO">Contado 100%</option>
                          <option value="TRES_CUOTAS_MP">3 Cuotas con Tarjeta MercadoPago (+5%)</option>
                        </select>
                      </div>
                    </div>

                    <label class="block font-semibold mb-1.5 text-navy-900">Módulos Opcionales Integrados (Upsells):</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <label class="flex items-center gap-2 p-2.5 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input 
                          type="checkbox"
                          checked={formData.upsellDelivery}
                          onChange={e => setFormData({...formData, upsellDelivery: e.target.checked})}
                          class="rounded text-navy-900"
                        />
                        <span>Delivery / Retiro ($40.000)</span>
                      </label>
                      <label class="flex items-center gap-2 p-2.5 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input 
                          type="checkbox"
                          checked={formData.upsellOnlinePay}
                          onChange={e => setFormData({...formData, upsellOnlinePay: e.target.checked})}
                          class="rounded text-navy-900"
                        />
                        <span>Pago Online Webpay ($80.000)</span>
                      </label>
                      <label class="flex items-center gap-2 p-2.5 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input 
                          type="checkbox"
                          checked={formData.hasDomainCl}
                          onChange={e => setFormData({...formData, hasDomainCl: e.target.checked})}
                          class="rounded text-navy-900"
                        />
                        <span>Dominio Propio .cl ($10.900)</span>
                      </label>
                    </div>
                  </div>

                  {/* Bloque 3: Liquidación 50/50 */}
                  <div>
                    <h4 class="font-serif-brand font-bold text-navy-900 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-paper-border">
                      3. Estado de Liquidación (Blindaje de Entrega)
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <label class="flex items-center gap-3 p-3 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input 
                          type="checkbox"
                          checked={formData.paidFirstHalf}
                          onChange={e => setFormData({...formData, paidFirstHalf: e.target.checked})}
                          class="rounded text-navy-900 w-4 h-4"
                        />
                        <div>
                          <span class="font-bold block text-navy-900">Anticipo 50% Recibido</span>
                          <span class="text-[10px] text-navy-600">Requisito obligatorio para iniciar desarrollo</span>
                        </div>
                      </label>
                      <label class="flex items-center gap-3 p-3 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input 
                          type="checkbox"
                          checked={formData.paidSecondHalf}
                          onChange={e => setFormData({...formData, paidSecondHalf: e.target.checked})}
                          class="rounded text-navy-900 w-4 h-4"
                        />
                        <div>
                          <span class="font-bold block text-navy-900">Saldo 50% Liquidado</span>
                          <span class="text-[10px] text-navy-600">Requisito para entrega de credenciales PRO</span>
                        </div>
                      </label>
                    </div>
                  </div>

                  {/* Bloque 4: Tiempos, Vencimientos y Soporte */}
                  <div>
                    <h4 class="font-serif-brand font-bold text-navy-900 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-paper-border">
                      4. Tiempos de Entrega, Fechas de Vencimiento y Soporte ($15k/m)
                    </h4>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                      <div>
                        <label class="block font-semibold mb-1 text-navy-900">Estado del Proyecto</label>
                        <select 
                          value={formData.statusDevelopment}
                          onChange={e => setFormData({...formData, statusDevelopment: e.target.value})}
                          class="w-full form-input p-2 rounded-lg text-xs"
                        >
                          <option value="PENDIENTE_INSUMOS">Pendiente Insumos</option>
                          <option value="EN_PROCESO">En Proceso (Desarrollo)</option>
                          <option value="DESPLEGADO">Desplegado / Terminado</option>
                        </select>
                      </div>
                      <div>
                        <label class="block font-semibold mb-1 text-navy-900">Fecha Límite SLA (72h)</label>
                        <input 
                          type="date"
                          value={formData.slaDueDate}
                          onChange={e => setFormData({...formData, slaDueDate: e.target.value})}
                          class="w-full form-input p-2 rounded-lg text-xs"
                        />
                      </div>
                      <div>
                        <label class="block font-semibold mb-1 text-navy-900">Vencimiento Dominio .cl</label>
                        <input 
                          type="date"
                          value={formData.domainRenewalDate}
                          onChange={e => setFormData({...formData, domainRenewalDate: e.target.value})}
                          class="w-full form-input p-2 rounded-lg text-xs"
                        />
                      </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
                      <div class="p-2.5 bg-white border border-paper-border rounded-lg">
                        <label class="flex items-center gap-2 cursor-pointer mb-1.5">
                          <input 
                            type="checkbox"
                            checked={formData.monthlySupport}
                            onChange={e => setFormData({...formData, monthlySupport: e.target.checked})}
                            class="rounded text-navy-900"
                          />
                          <span class="font-bold text-navy-900">Soporte Técnico Mensual ($15.000 CLP)</span>
                        </label>
                        <label class="block text-[10px] text-navy-600 mb-1">Próxima Fecha de Cobro de Soporte:</label>
                        <input 
                          type="date"
                          value={formData.supportRenewalDate}
                          onChange={e => setFormData({...formData, supportRenewalDate: e.target.value})}
                          class="w-full form-input p-1.5 rounded text-xs"
                        />
                      </div>

                      <div class="p-2.5 bg-white border border-paper-border rounded-lg flex items-center">
                        <label class="flex items-center gap-2.5 cursor-pointer">
                          <input 
                            type="checkbox"
                            checked={formData.inputsReceived}
                            onChange={e => setFormData({...formData, inputsReceived: e.target.checked})}
                            class="rounded text-navy-900 w-4 h-4"
                          />
                          <div>
                            <span class="font-bold text-navy-900 block">Insumos Recibidos al 100%</span>
                            <span class="text-[10px] text-navy-600">Inicia el cómputo oficial de 24 a 72 horas hábiles</span>
                          </div>
                        </label>
                      </div>
                    </div>

                    <div>
                      <label class="block font-semibold mb-1 text-navy-900">Nombre de Dominio o Subdominio Asignado</label>
                      <input 
                        type="text"
                        value={formData.domainName || formData.subdomain}
                        onChange={e => setFormData({...formData, domainName: e.target.value, subdomain: e.target.value})}
                        placeholder="ejemplo.cl o ejemplo.alejandrodev.cl"
                        class="w-full form-input p-2 rounded-lg text-xs"
                      />
                    </div>
                  </div>

                  {/* Notas */}
                  <div>
                    <label class="block font-semibold mb-1 text-navy-900">Observaciones Técnicas / Enlaces de Repositorio o Panel</label>
                    <textarea 
                      rows="2"
                      value={formData.notes}
                      onChange={e => setFormData({...formData, notes: e.target.value})}
                      placeholder="Ej. Proyecto Vercel asignado a cliente. Menú validado por WhatsApp."
                      class="w-full form-input p-2 rounded-lg text-xs"
                    ></textarea>
                  </div>

                  {/* Footer del Modal */}
                  <div class="pt-4 border-t border-paper-border flex items-center justify-end gap-3">
                    <button 
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      class="btn-outline-navy px-4 py-2 rounded-lg text-xs font-semibold"
                    >
                      Cancelar
                    </button>
                    <button 
                      type="submit"
                      class="btn-navy px-6 py-2 rounded-lg text-xs font-semibold shadow-md"
                    >
                      Guardar Contrato
                    </button>
                  </div>

                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
