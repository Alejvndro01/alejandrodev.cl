<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Clientes & Contratos | Alejandro Dev</title>
  
  <!-- Google Fonts: Cinzel & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'paper': '#F7F4EC',
            'paper-card': '#FAF7F0',
            'paper-border': '#E2DAC9',
            'navy-950': '#050D1A',
            'navy-900': '#0A192F',
            'navy-800': '#0F2544',
            'navy-700': '#1A365D',
            'navy-600': '#2A4365',
            'tape-blue': '#163359',
            'gold-accent': '#C5A880',
            'gold-light': '#DFC8AA',
            'status-green': '#1E5E3A',
            'status-green-bg': '#EBF5EE',
            'status-amber': '#9C6B15',
            'status-amber-bg': '#FEF7E8',
          },
          fontFamily: {
            'serif-brand': ['Cinzel', 'serif'],
            'body': ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel for standalone execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { scroll-behavior: smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #F7F4EC;
      color: #0A192F;
    }

    .bg-paper-texture {
      background-color: #F7F4EC;
      background-image: radial-gradient(rgba(10, 25, 47, 0.05) 1px, transparent 0);
      background-size: 24px 24px;
    }

    .paper-card {
      background: #FAF7F0;
      border: 1px solid #E2DAC9;
      box-shadow: 0 4px 20px rgba(10, 25, 47, 0.04);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .tape-accent {
      position: absolute;
      background: #163359;
      box-shadow: 0 2px 6px rgba(10, 25, 47, 0.3);
      transform: rotate(-10deg);
      border-radius: 2px;
      z-index: 10;
    }

    .btn-navy {
      background: #0A192F;
      color: #F7F4EC;
      border: 1px solid #0A192F;
      transition: all 0.25s ease;
    }
    .btn-navy:hover {
      background: #1A365D;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(10, 25, 47, 0.18);
    }

    .btn-outline-navy {
      border: 1.5px solid #0A192F;
      color: #0A192F;
      background: transparent;
      transition: all 0.25s ease;
    }
    .btn-outline-navy:hover {
      background: #0A192F;
      color: #F7F4EC;
      transform: translateY(-1px);
    }

    .form-input {
      background: #FFFFFF;
      border: 1px solid #D6CEBE;
      color: #0A192F;
      transition: all 0.2s;
    }
    .form-input:focus {
      border-color: #0A192F;
      outline: none;
      box-shadow: 0 0 0 3px rgba(10, 25, 47, 0.08);
    }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: #F7F4EC; }
    ::-webkit-scrollbar-thumb { background: #D0C6B4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #0A192F; }
  </style>
</head>
<body class="h-full bg-paper-texture flex flex-col selection:bg-navy-900 selection:text-paper">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const LOGO_SRC = "../assets/logo.png";

    const INITIAL_CLIENTS = [
      {
        id: "CLI-001",
        businessName: "Burger House San Bernardo",
        contactName: "Carlos Muñoz",
        rut: "16.421.980-3",
        phone: "+56987654321",
        city: "San Bernardo",
        plan: "PREMIUM",
        pricePlan: 250000,
        hasDomainCl: true,
        domainName: "burgerhousesb.cl",
        domainRenewalDate: "2027-09-15",
        subdomain: "burgerhousesb.alejandrodev.cl",
        upsellDelivery: true,
        upsellOnlinePay: false,
        monthlySupport: true,
        supportRenewalDate: "2026-10-01",
        contractDate: "2026-09-01",
        inputsReceived: true,
        slaDueDate: "2026-09-04",
        statusDevelopment: "EN_PROCESO",
        paymentMethod: "DOS_CUOTAS",
        paidFirstHalf: true,
        paidSecondHalf: false,
        notes: "Entregar credenciales del Panel de Control PRO al liquidar el 50% restante."
      },
      {
        id: "CLI-002",
        businessName: "Sushi Fusion Concepción",
        contactName: "Valeria Soto",
        rut: "18.332.114-K",
        phone: "+56912345678",
        city: "Concepción",
        plan: "ESENCIAL",
        pricePlan: 120000,
        hasDomainCl: false,
        domainName: "",
        domainRenewalDate: "",
        subdomain: "sushifusion.alejandrodev.cl",
        upsellDelivery: false,
        upsellOnlinePay: false,
        monthlySupport: false,
        supportRenewalDate: "",
        contractDate: "2026-09-02",
        inputsReceived: false,
        slaDueDate: "",
        statusDevelopment: "PENDIENTE_INSUMOS",
        paymentMethod: "CONTADO",
        paidFirstHalf: true,
        paidSecondHalf: true,
        notes: "Cliente pagó 100% anticipado. Pendiente envío de logo en alta resolución y menú."
      }
    ];

    function calculateFinancials(client) {
      let totalContract = client.pricePlan;
      if (client.hasDomainCl) totalContract += 10900;
      if (client.upsellDelivery) totalContract += 40000;
      if (client.upsellOnlinePay) totalContract += 80000;

      let amountPaid = 0;
      if (client.paymentMethod === "CONTADO") {
        amountPaid = (client.paidFirstHalf && client.paidSecondHalf) ? totalContract : (client.paidFirstHalf ? totalContract * 0.5 : 0);
      } else {
        const half = totalContract / 2;
        if (client.paidFirstHalf) amountPaid += half;
        if (client.paidSecondHalf) amountPaid += half;
      }

      const pendingBalance = Math.max(0, totalContract - amountPaid);
      return { totalContract, amountPaid, pendingBalance };
    }

    function formatCLP(val) {
      return "$" + Math.round(val).toLocaleString("es-CL");
    }

    function App() {
      // Estado de autenticación por contraseña interna
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem("alejandrodev_admin_auth") === "true";
      });
      const [passInput, setPassInput] = useState("");
      const [loginError, setLoginError] = useState(false);

      // CAMBIA AQUÍ TU CONTRASEÑA SECRETA
      const ADMIN_SECRET_PASSWORD = "AlejoDev2026*";

      const handleLogin = (e) => {
        e.preventDefault();
        if (passInput === ADMIN_SECRET_PASSWORD) {
          setIsAuthenticated(true);
          sessionStorage.setItem("alejandrodev_admin_auth", "true");
        } else {
          setLoginError(true);
        }
      };

      const [clients, setClients] = useState(() => {
        const local = localStorage.getItem("alejandrodev_clients_store");
        return local ? JSON.parse(local) : INITIAL_CLIENTS;
      });

      const [searchQuery, setSearchQuery] = useState("");
      const [filterCategory, setFilterCategory] = useState("ALL");
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalMode, setModalMode] = useState("CREATE");

      const initialForm = {
        id: "",
        businessName: "",
        contactName: "",
        rut: "",
        phone: "+56 9 ",
        city: "",
        plan: "PREMIUM",
        pricePlan: 250000,
        hasDomainCl: false,
        domainName: "",
        domainRenewalDate: "",
        subdomain: "",
        upsellDelivery: false,
        upsellOnlinePay: false,
        monthlySupport: false,
        supportRenewalDate: "",
        contractDate: new Date().toISOString().split("T")[0],
        inputsReceived: false,
        slaDueDate: "",
        statusDevelopment: "PENDIENTE_INSUMOS",
        paymentMethod: "DOS_CUOTAS",
        paidFirstHalf: false,
        paidSecondHalf: false,
        notes: ""
      };

      const [formData, setFormData] = useState(initialForm);

      useEffect(() => {
        localStorage.setItem("alejandrodev_clients_store", JSON.stringify(clients));
      }, [clients]);

      const metrics = useMemo(() => {
        let totalRevenue = 0;
        let pendingBalance = 0;
        let activeSupportMRR = 0;
        let activeDeployments = 0;

        clients.forEach(c => {
          const fin = calculateFinancials(c);
          totalRevenue += fin.amountPaid;
          pendingBalance += fin.pendingBalance;
          if (c.monthlySupport) activeSupportMRR += 15000;
          if (c.statusDevelopment === "EN_PROCESO" || c.statusDevelopment === "PENDIENTE_INSUMOS") {
            activeDeployments++;
          }
        });

        return { totalRevenue, pendingBalance, activeSupportMRR, activeDeployments };
      }, [clients]);

      const filteredClients = useMemo(() => {
        return clients.filter(c => {
          const query = searchQuery.toLowerCase();
          const matchesText = 
            c.businessName.toLowerCase().includes(query) ||
            c.contactName.toLowerCase().includes(query) ||
            c.phone.includes(query) ||
            c.city.toLowerCase().includes(query) ||
            (c.domainName && c.domainName.toLowerCase().includes(query));

          if (!matchesText) return false;

          if (filterCategory === "PENDING_PAYMENT") {
            return calculateFinancials(c).pendingBalance > 0;
          }
          if (filterCategory === "IN_PROGRESS") {
            return c.statusDevelopment === "EN_PROCESO" || c.statusDevelopment === "PENDIENTE_INSUMOS";
          }
          if (filterCategory === "SUPPORT_ACTIVE") {
            return c.monthlySupport;
          }
          if (filterCategory === "DOMAINS") {
            return c.hasDomainCl;
          }
          return true;
        });
      }, [clients, searchQuery, filterCategory]);

      const handleOpenCreate = () => {
        setFormData({
          ...initialForm,
          id: "AD-" + String(Date.now()).slice(-4)
        });
        setModalMode("CREATE");
        setIsModalOpen(true);
      };

      const handleOpenEdit = (c) => {
        setFormData(c);
        setModalMode("EDIT");
        setIsModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        const basePrice = formData.plan === "PREMIUM" ? 250000 : 120000;
        const toSave = {
          ...formData,
          pricePlan: basePrice
        };

        if (modalMode === "CREATE") {
          setClients([toSave, ...clients]);
        } else {
          setClients(clients.map(c => c.id === toSave.id ? toSave : c));
        }
        setIsModalOpen(false);
      };

      const handleDelete = (id) => {
        if (confirm("¿Estás seguro de que deseas eliminar este cliente y su contrato?")) {
          setClients(clients.filter(c => c.id !== id));
        }
      };

      const togglePayment = (clientId, key) => {
        setClients(clients.map(c => {
          if (c.id === clientId) {
            return { ...c, [key]: !c[key] };
          }
          return c;
        }));
      };

      // PANTALLA DE BLOQUEO SI NO ESTÁ AUTENTICADO
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-paper-texture">
            <div className="paper-card rounded-2xl p-8 max-w-md w-full shadow-xl border border-paper-border text-center">
              <div className="w-14 h-14 rounded-full bg-navy-900 text-paper mx-auto flex items-center justify-center mb-4 shadow-sm overflow-hidden p-1.5">
                <img src={LOGO_SRC} alt="Logo" className="w-full h-full object-contain" />
              </div>
              <h2 className="font-serif-brand text-xl font-bold text-navy-900 mb-1">Acceso Restringido</h2>
              <p className="text-xs text-navy-700/80 mb-6">Panel Operativo & Contratos • Alejandro Dev</p>
              
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <input 
                    type="password"
                    value={passInput}
                    onChange={e => { setPassInput(e.target.value); setLoginError(false); }}
                    placeholder="Introduce tu contraseña"
                    className="w-full form-input p-3 rounded-lg text-xs text-center font-mono tracking-wider"
                    autoFocus
                  />
                  {loginError && <p className="text-red-700 text-[11px] mt-1.5 font-semibold">Contraseña incorrecta.</p>}
                </div>
                <button 
                  type="submit"
                  className="w-full btn-navy py-3 rounded-lg text-xs font-semibold shadow-sm"
                >
                  Desbloquear Panel
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-paper-texture">
          
          {/* HEADER / NAVIGATION */}
          <header className="sticky top-0 z-40 bg-paper/95 backdrop-blur-md border-b border-paper-border">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-full bg-white border border-paper-border flex items-center justify-center p-1.5 shadow-sm overflow-hidden">
                    <img src={LOGO_SRC} alt="Alejandro Dev Logo" className="w-full h-full object-contain" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="font-serif-brand font-bold text-navy-900 text-lg tracking-wider">ALEJANDRO DEV</span>
                      <span className="text-[10px] uppercase font-bold tracking-widest bg-navy-900 text-paper px-2 py-0.5 rounded">Panel Clientes</span>
                    </div>
                    <p className="text-xs text-navy-700/80 font-medium">Software con Paz • Cartas Digitales & Pedidos WhatsApp</p>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <div className="hidden md:flex items-center gap-4 text-xs font-semibold text-navy-800 pr-3 border-r border-paper-border">
                    <div className="flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-status-green"></span>
                      <span>Hualqui / Biobío, Chile</span>
                    </div>
                    <span className="text-navy-900/40">•</span>
                    <span>Ref: AD-CD-2026</span>
                  </div>
                  <button 
                    onClick={handleOpenCreate}
                    className="btn-navy px-4 py-2.5 rounded-lg text-xs md:text-sm font-semibold flex items-center gap-2 shadow-sm"
                  >
                    <i className="fa-solid fa-plus text-xs"></i>
                    <span>Registrar Contrato</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            
            {/* HERO BANNER DE CONTROL */}
            <div className="relative paper-card rounded-2xl p-6 sm:p-8 overflow-hidden">
              <div className="tape-accent top-[-10px] right-10 w-28 h-6"></div>
              
              <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                  <span className="text-xs font-bold uppercase tracking-widest text-gold-accent flex items-center gap-1.5 mb-1.5">
                    <i className="fa-solid fa-file-signature text-xs"></i> Sistema de Control Operativo
                  </span>
                  <h1 className="font-serif-brand text-2xl sm:text-3xl font-extrabold text-navy-900 tracking-tight">
                    Administración de Clientes & Contratos
                  </h1>
                  <p className="text-sm text-navy-700/80 mt-1 max-w-2xl leading-relaxed">
                    Supervisa el ciclo de vida según el Acuerdo de Servicio: liquidaciones 50/50, vencimientos de dominios .cl, cómputos de SLA (72h) y suscripciones de soporte recurrente.
                  </p>
                </div>

                <div className="flex items-center gap-2 text-xs font-medium">
                  <a 
                    href="https://wa.me/56963558009" 
                    target="_blank"
                    className="btn-outline-navy px-3.5 py-2 rounded-lg flex items-center gap-1.5"
                  >
                    <i className="fa-brands fa-whatsapp text-emerald-600"></i> +56 9 6355 8009
                  </a>
                </div>
              </div>

              {/* STATS TILES */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-8 pt-6 border-t border-paper-border">
                <div className="bg-white/80 border border-paper-border p-4 rounded-xl">
                  <div className="flex items-center justify-between text-xs text-navy-700/70 font-semibold mb-1">
                    <span>Cobrado Real</span>
                    <i className="fa-solid fa-circle-check text-status-green"></i>
                  </div>
                  <div className="font-serif-brand text-xl sm:text-2xl font-bold text-navy-900">
                    {formatCLP(metrics.totalRevenue)}
                  </div>
                  <div className="text-[11px] text-navy-600 mt-0.5">Anticipos y liquidaciones</div>
                </div>

                <div className="bg-white/80 border border-paper-border p-4 rounded-xl">
                  <div className="flex items-center justify-between text-xs text-navy-700/70 font-semibold mb-1">
                    <span>Saldos por Cobrar (50%)</span>
                    <i className="fa-solid fa-hourglass-half text-status-amber"></i>
                  </div>
                  <div className="font-serif-brand text-xl sm:text-2xl font-bold text-status-amber">
                    {formatCLP(metrics.pendingBalance)}
                  </div>
                  <div className="text-[11px] text-navy-600 mt-0.5">Requisito para entrega PRO</div>
                </div>

                <div className="bg-white/80 border border-paper-border p-4 rounded-xl">
                  <div className="flex items-center justify-between text-xs text-navy-700/70 font-semibold mb-1">
                    <span>MRR Soporte ($15k/m)</span>
                    <i className="fa-solid fa-screwdriver-wrench text-navy-700"></i>
                  </div>
                  <div className="font-serif-brand text-xl sm:text-2xl font-bold text-navy-900">
                    {formatCLP(metrics.activeSupportMRR)}
                  </div>
                  <div className="text-[11px] text-navy-600 mt-0.5">Suscripciones voluntarias activas</div>
                </div>

                <div className="bg-white/80 border border-paper-border p-4 rounded-xl">
                  <div className="flex items-center justify-between text-xs text-navy-700/70 font-semibold mb-1">
                    <span>En Desarrollo / SLA</span>
                    <i className="fa-solid fa-laptop-code text-navy-700"></i>
                  </div>
                  <div className="font-serif-brand text-xl sm:text-2xl font-bold text-navy-900">
                    {metrics.activeDeployments} Locales
                  </div>
                  <div className="text-[11px] text-navy-600 mt-0.5">Meta 24 a 72 hrs hábiles</div>
                </div>
              </div>
            </div>

            {/* BARRA DE FILTROS & BÚSQUEDA */}
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center flex-wrap gap-2 text-xs font-semibold">
                <button
                  onClick={() => setFilterCategory("ALL")}
                  className={`px-3.5 py-2 rounded-lg transition ${filterCategory === "ALL" ? "btn-navy shadow-sm" : "paper-card text-navy-700 hover:text-navy-900"}`}
                >
                  Todos ({clients.length})
                </button>
                <button
                  onClick={() => setFilterCategory("PENDING_PAYMENT")}
                  className={`px-3.5 py-2 rounded-lg transition ${filterCategory === "PENDING_PAYMENT" ? "btn-navy shadow-sm" : "paper-card text-navy-700 hover:text-navy-900"}`}
                >
                  <i className="fa-solid fa-receipt mr-1 text-gold-accent"></i> Con Saldo Pendiente
                </button>
                <button
                  onClick={() => setFilterCategory("IN_PROGRESS")}
                  className={`px-3.5 py-2 rounded-lg transition ${filterCategory === "IN_PROGRESS" ? "btn-navy shadow-sm" : "paper-card text-navy-700 hover:text-navy-900"}`}
                >
                  <i className="fa-solid fa-spinner mr-1"></i> En Desarrollo
                </button>
                <button
                  onClick={() => setFilterCategory("DOMAINS")}
                  className={`px-3.5 py-2 rounded-lg transition ${filterCategory === "DOMAINS" ? "btn-navy shadow-sm" : "paper-card text-navy-700 hover:text-navy-900"}`}
                >
                  <i className="fa-solid fa-globe mr-1"></i> Dominios .cl
                </button>
                <button
                  onClick={() => setFilterCategory("SUPPORT_ACTIVE")}
                  className={`px-3.5 py-2 rounded-lg transition ${filterCategory === "SUPPORT_ACTIVE" ? "btn-navy shadow-sm" : "paper-card text-navy-700 hover:text-navy-900"}`}
                >
                  <i className="fa-solid fa-headset mr-1"></i> Soporte Activo
                </button>
              </div>

              <div className="relative w-full md:w-80">
                <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-navy-900/40 text-xs"></i>
                <input 
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Buscar negocio, titular, ciudad o RUT..."
                  className="w-full form-input pl-9 pr-3 py-2 rounded-lg text-xs"
                />
              </div>
            </div>

            {/* TABLA PRINCIPAL */}
            <div className="paper-card rounded-2xl overflow-hidden shadow-sm">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead className="bg-paper-card border-b border-paper-border text-navy-900 font-serif-brand font-bold uppercase tracking-wider text-[11px]">
                    <tr>
                      <th className="py-3.5 px-4">Local / Titular</th>
                      <th className="py-3.5 px-4">Modalidad Contratada</th>
                      <th className="py-3.5 px-4">Estado Liquidación (50/50)</th>
                      <th className="py-3.5 px-4">SLA & Despliegue</th>
                      <th className="py-3.5 px-4">Dominio & Soporte</th>
                      <th className="py-3.5 px-4 text-right">Acciones</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-paper-border text-navy-800">
                    {filteredClients.length === 0 ? (
                      <tr>
                        <td colspan="6" className="py-12 text-center text-navy-600">
                          <i className="fa-regular fa-folder-open text-3xl mb-2 block text-navy-400"></i>
                          No se encontraron contratos con los filtros seleccionados.
                        </td>
                      </tr>
                    ) : (
                      filteredClients.map(client => {
                        const fin = calculateFinancials(client);
                        const isFullyPaid = fin.pendingBalance <= 0;

                        return (
                          <tr key={client.id} className="hover:bg-white/60 transition">
                            <td className="py-4 px-4 align-top">
                              <div className="flex items-center gap-2">
                                <span className="font-bold text-sm text-navy-900">{client.businessName}</span>
                                <span className="font-mono text-[10px] bg-paper-border px-1.5 py-0.5 rounded text-navy-800 font-semibold">{client.id}</span>
                              </div>
                              <div className="text-navy-700/80 mt-0.5">
                                {client.contactName} {client.rut ? `• ${client.rut}` : ""}
                              </div>
                              <div className="mt-1 flex items-center gap-2 text-navy-600">
                                <a 
                                  href={`https://wa.me/${client.phone.replace(/[^0-9]/g, '')}`}
                                  target="_blank"
                                  className="text-emerald-700 font-medium hover:underline flex items-center gap-1"
                                >
                                  <i className="fa-brands fa-whatsapp text-xs"></i>
                                  {client.phone}
                                </a>
                                <span>•</span>
                                <span className="text-navy-600">{client.city || "Chile"}</span>
                              </div>
                            </td>

                            <td className="py-4 px-4 align-top">
                              <div className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full font-serif-brand font-bold text-[11px] border border-navy-900/20 bg-white">
                                {client.plan === "PREMIUM" ? "PLAN PREMIUM (PRO)" : "PLAN ESENCIAL"}
                              </div>
                              <div className="mt-1.5 space-y-0.5 text-[11px] text-navy-700 font-medium">
                                <div>Base: {formatCLP(client.pricePlan)}</div>
                                {client.upsellDelivery && <div className="text-navy-900">+ Módulo Delivery ($40k)</div>}
                                {client.upsellOnlinePay && <div className="text-navy-900">+ Webpay / Pago Online ($80k)</div>}
                                {client.hasDomainCl && <div className="text-navy-900">+ Dominio .cl ($10.9k)</div>}
                              </div>
                            </td>

                            <td className="py-4 px-4 align-top">
                              <div className="font-bold text-navy-900 text-xs font-serif-brand">
                                Total: {formatCLP(fin.totalContract)}
                              </div>

                              <div className="flex items-center gap-1.5 mt-1.5">
                                <button
                                  onClick={() => togglePayment(client.id, 'paidFirstHalf')}
                                  title="Clic para cambiar estado del Anticipo"
                                  className={`px-2 py-0.5 rounded text-[10px] font-semibold flex items-center gap-1 transition ${
                                    client.paidFirstHalf 
                                      ? "bg-status-green-bg text-status-green border border-status-green/30" 
                                      : "bg-red-50 text-red-700 border border-red-200"
                                  }`}
                                >
                                  <i className={`fa-solid ${client.paidFirstHalf ? "fa-check" : "fa-xmark"} text-[9px]`}></i>
                                  1ª (50%)
                                </button>

                                <button
                                  onClick={() => togglePayment(client.id, 'paidSecondHalf')}
                                  title="Clic para cambiar estado del Saldo de Entrega"
                                  className={`px-2 py-0.5 rounded text-[10px] font-semibold flex items-center gap-1 transition ${
                                    client.paidSecondHalf 
                                      ? "bg-status-green-bg text-status-green border border-status-green/30" 
                                      : "bg-red-50 text-red-700 border border-red-200"
                                  }`}
                                >
                                  <i className={`fa-solid ${client.paidSecondHalf ? "fa-check" : "fa-xmark"} text-[9px]`}></i>
                                  2ª (50%)
                                </button>
                              </div>

                              <div className="mt-1.5">
                                {isFullyPaid ? (
                                  <span className="text-status-green font-bold text-[11px] flex items-center gap-1">
                                    <i className="fa-solid fa-lock-open text-[10px]"></i> Liquidado 100% (PRO liberado)
                                  </span>
                                ) : (
                                  <span className="text-status-amber font-bold text-[11px] flex items-center gap-1">
                                    <i className="fa-solid fa-clock text-[10px]"></i> Saldo: {formatCLP(fin.pendingBalance)}
                                  </span>
                                )}
                              </div>
                            </td>

                            <td className="py-4 px-4 align-top">
                              <span className={`inline-block px-2 py-0.5 rounded text-[11px] font-semibold border ${
                                client.statusDevelopment === "DESPLEGADO" 
                                  ? "bg-status-green-bg text-status-green border-status-green/30"
                                  : client.statusDevelopment === "EN_PROCESO"
                                  ? "bg-sky-50 text-sky-800 border-sky-200"
                                  : "bg-amber-50 text-amber-800 border-amber-200"
                              }`}
                              >
                                {client.statusDevelopment.replace("_", " ")}
                              </span>

                              <div className="mt-1 text-navy-700 text-[11px]">
                                {client.inputsReceived ? (
                                  <span className="text-status-green font-medium">✓ Insumos entregados</span>
                                ) : (
                                  <span className="text-status-amber font-medium">⏳ Espera insumos (SLA detenido)</span>
                                )}
                              </div>

                              {client.slaDueDate && (
                                <div className="text-[10px] text-navy-600 mt-0.5">
                                  Límite SLA: <span className="font-bold text-navy-800">{client.slaDueDate}</span>
                                </div>
                              )}
                            </td>

                            <td className="py-4 px-4 align-top text-[11px]">
                              <div>
                                {client.monthlySupport ? (
                                  <div className="font-semibold text-navy-900 flex items-center gap-1">
                                    <i className="fa-solid fa-shield-halved text-gold-accent"></i>
                                    Soporte Activo ($15.000/m)
                                    {client.supportRenewalDate && (
                                      <span className="text-[10px] text-navy-600 block">Vence: {client.supportRenewalDate}</span>
                                    )}
                                  </div>
                                ) : (
                                  <span className="text-navy-900/50">Sin abono mensual</span>
                                )}
                              </div>

                              <div className="mt-1.5">
                                {client.hasDomainCl ? (
                                  <div className="text-navy-900">
                                    <i className="fa-solid fa-globe text-navy-700 mr-1"></i>
                                    <span className="font-semibold">{client.domainName || "Dominio .cl"}</span>
                                    {client.domainRenewalDate && (
                                      <span className="text-[10px] text-navy-600 block">Renovación NIC: {client.domainRenewalDate}</span>
                                    )}
                                  </div>
                                ) : (
                                  <div className="text-[10px] text-navy-600 font-mono">
                                    {client.subdomain || "cliente.alejandrodev.cl"}
                                  </div>
                                )}
                              </div>
                            </td>

                            <td className="py-4 px-4 align-top text-right">
                              <div className="flex items-center justify-end gap-1">
                                <button
                                  onClick={() => handleOpenEdit(client)}
                                  className="p-1.5 text-navy-700 hover:text-navy-950 hover:bg-white rounded border border-transparent hover:border-paper-border transition"
                                  title="Editar contrato"
                                >
                                  <i className="fa-regular fa-pen-to-square"></i>
                                </button>
                                <button
                                  onClick={() => handleDelete(client.id)}
                                  className="p-1.5 text-red-600 hover:text-red-800 hover:bg-red-50 rounded border border-transparent hover:border-red-200 transition"
                                  title="Eliminar contrato"
                                >
                                  <i className="fa-regular fa-trash-can"></i>
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* FOOTER */}
          <footer className="mt-auto border-t border-paper-border bg-paper-card py-6">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-navy-700/80">
              <div className="flex items-center gap-2">
                <span className="font-serif-brand font-bold text-navy-900">Alejandro Dev</span>
                <span>• Dilan Baltras Servicios Digitales (RUT: 20.599.341-K)</span>
              </div>
              <div>
                Garantía y Acreditación de Servicio Ref: AD-CD-2026 • Hualqui, Chile
              </div>
            </div>
          </footer>

          {/* MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-navy-950/60 backdrop-blur-sm">
              <div className="paper-card rounded-2xl w-full max-w-2xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl border-2 border-paper-border">
                <div className="p-5 border-b border-paper-border flex items-center justify-between bg-paper-card">
                  <div className="flex items-center gap-2.5">
                    <img src={LOGO_SRC} alt="Logo" className="w-7 h-7 object-contain" />
                    <div>
                      <h3 className="font-serif-brand font-bold text-navy-900 text-base">
                        {modalMode === "CREATE" ? "Registrar Nuevo Contrato" : `Editar Contrato: ${formData.businessName}`}
                      </h3>
                      <p className="text-[11px] text-navy-700/80">Formulario alineado a las cláusulas del Acuerdo de Trabajo</p>
                    </div>
                  </div>
                  <button onClick={() => setIsModalOpen(false)} className="text-navy-900/60 hover:text-navy-900 text-lg p-1">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <form onSubmit={handleSave} className="p-6 overflow-y-auto space-y-6 text-xs text-navy-800">
                  <div>
                    <h4 className="font-serif-brand font-bold text-navy-900 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-paper-border">
                      1. Identificación del Local / Contratante
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Nombre del Local / Negocio *</label>
                        <input required type="text" value={formData.businessName} onChange={e => setFormData({...formData, businessName: e.target.value})} placeholder="Ej. Pizzería Bella Italia" className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Titular / Representante *</label>
                        <input required type="text" value={formData.contactName} onChange={e => setFormData({...formData, contactName: e.target.value})} placeholder="Ej. Juan Pérez" className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">RUT (Empresa o Personal)</label>
                        <input type="text" value={formData.rut} onChange={e => setFormData({...formData, rut: e.target.value})} placeholder="12.345.678-9" className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">WhatsApp Comercial de Pedidos *</label>
                        <input required type="text" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} placeholder="+56 9 1234 5678" className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Ciudad / Dirección</label>
                        <input type="text" value={formData.city} onChange={e => setFormData({...formData, city: e.target.value})} placeholder="Ej. Concepción / Hualqui" className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Fecha de Firma Contrato</label>
                        <input type="date" value={formData.contractDate} onChange={e => setFormData({...formData, contractDate: e.target.value})} className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-serif-brand font-bold text-navy-900 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-paper-border">
                      2. Planes y Opciones de Pago (Cláusulas 2 y 3)
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Plan Contratado</label>
                        <select value={formData.plan} onChange={e => setFormData({...formData, plan: e.target.value})} className="w-full form-input p-2 rounded-lg text-xs font-medium">
                          <option value="PREMIUM">Plan Premium ($250.000 CLP - Panel PRO)</option>
                          <option value="ESENCIAL">Plan Esencial ($120.000 CLP - Config inicial)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Modalidad de Pago Acordada</label>
                        <select value={formData.paymentMethod} onChange={e => setFormData({...formData, paymentMethod: e.target.value})} className="w-full form-input p-2 rounded-lg text-xs font-medium">
                          <option value="DOS_CUOTAS">2 Cuotas Directas (50% anticipo / 50% entrega)</option>
                          <option value="CONTADO">Contado 100%</option>
                          <option value="TRES_CUOTAS_MP">3 Cuotas con Tarjeta MercadoPago (+5%)</option>
                        </select>
                      </div>
                    </div>

                    <label className="block font-semibold mb-1.5 text-navy-900">Módulos Opcionales Integrados (Upsells):</label>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                      <label className="flex items-center gap-2 p-2.5 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input type="checkbox" checked={formData.upsellDelivery} onChange={e => setFormData({...formData, upsellDelivery: e.target.checked})} className="rounded text-navy-900" />
                        <span>Delivery / Retiro ($40.000)</span>
                      </label>
                      <label className="flex items-center gap-2 p-2.5 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input type="checkbox" checked={formData.upsellOnlinePay} onChange={e => setFormData({...formData, upsellOnlinePay: e.target.checked})} className="rounded text-navy-900" />
                        <span>Pago Online Webpay ($80.000)</span>
                      </label>
                      <label className="flex items-center gap-2 p-2.5 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input type="checkbox" checked={formData.hasDomainCl} onChange={e => setFormData({...formData, hasDomainCl: e.target.checked})} className="rounded text-navy-900" />
                        <span>Dominio Propio .cl ($10.900)</span>
                      </label>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-serif-brand font-bold text-navy-900 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-paper-border">
                      3. Estado de Liquidación (Blindaje de Entrega)
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <label className="flex items-center gap-3 p-3 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input type="checkbox" checked={formData.paidFirstHalf} onChange={e => setFormData({...formData, paidFirstHalf: e.target.checked})} className="rounded text-navy-900 w-4 h-4" />
                        <div>
                          <span className="font-bold block text-navy-900">Anticipo 50% Recibido</span>
                          <span className="text-[10px] text-navy-600">Requisito obligatorio para iniciar desarrollo</span>
                        </div>
                      </label>
                      <label className="flex items-center gap-3 p-3 bg-white border border-paper-border rounded-lg cursor-pointer">
                        <input type="checkbox" checked={formData.paidSecondHalf} onChange={e => setFormData({...formData, paidSecondHalf: e.target.checked})} className="rounded text-navy-900 w-4 h-4" />
                        <div>
                          <span className="font-bold block text-navy-900">Saldo 50% Liquidado</span>
                          <span className="text-[10px] text-navy-600">Requisito para entrega de credenciales PRO</span>
                        </div>
                      </label>
                    </div>
                  </div>

                  <div>
                    <h4 className="font-serif-brand font-bold text-navy-900 uppercase tracking-wider text-[11px] mb-3 pb-1 border-b border-paper-border">
                      4. Tiempos de Entrega, Fechas de Vencimiento y Soporte ($15k/m)
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-3">
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Estado del Proyecto</label>
                        <select value={formData.statusDevelopment} onChange={e => setFormData({...formData, statusDevelopment: e.target.value})} className="w-full form-input p-2 rounded-lg text-xs">
                          <option value="PENDIENTE_INSUMOS">Pendiente Insumos</option>
                          <option value="EN_PROCESO">En Proceso (Desarrollo)</option>
                          <option value="DESPLEGADO">Desplegado / Terminado</option>
                        </select>
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Fecha Límite SLA (72h)</label>
                        <input type="date" value={formData.slaDueDate} onChange={e => setFormData({...formData, slaDueDate: e.target.value})} className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                      <div>
                        <label className="block font-semibold mb-1 text-navy-900">Vencimiento Dominio .cl</label>
                        <input type="date" value={formData.domainRenewalDate} onChange={e => setFormData({...formData, domainRenewalDate: e.target.value})} className="w-full form-input p-2 rounded-lg text-xs" />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-2">
                      <div className="p-2.5 bg-white border border-paper-border rounded-lg">
                        <label className="flex items-center gap-2 cursor-pointer mb-1.5">
                          <input type="checkbox" checked={formData.monthlySupport} onChange={e => setFormData({...formData, monthlySupport: e.target.checked})} className="rounded text-navy-900" />
                          <span className="font-bold text-navy-900">Soporte Técnico Mensual ($15.000 CLP)</span>
                        </label>
                        <label className="block text-[10px] text-navy-600 mb-1">Próxima Fecha de Cobro de Soporte:</label>
                        <input type="date" value={formData.supportRenewalDate} onChange={e => setFormData({...formData, supportRenewalDate: e.target.value})} className="w-full form-input p-1.5 rounded text-xs" />
                      </div>

                      <div className="p-2.5 bg-white border border-paper-border rounded-lg flex items-center">
                        <label className="flex items-center gap-2.5 cursor-pointer">
                          <input type="checkbox" checked={formData.inputsReceived} onChange={e => setFormData({...formData, inputsReceived: e.target.checked})} className="rounded text-navy-900 w-4 h-4" />
                          <div>
                            <span className="font-bold text-navy-900 block">Insumos Recibidos al 100%</span>
                            <span className="text-[10px] text-navy-600">Inicia el cómputo oficial de 24 a 72 horas hábiles</span>
                          </div>
                        </label>
                      </div>
                    </div>

                    <div>
                      <label className="block font-semibold mb-1 text-navy-900">Nombre de Dominio o Subdominio Asignado</label>
                      <input type="text" value={formData.domainName || formData.subdomain} onChange={e => setFormData({...formData, domainName: e.target.value, subdomain: e.target.value})} placeholder="ejemplo.cl o ejemplo.alejandrodev.cl" className="w-full form-input p-2 rounded-lg text-xs" />
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold mb-1 text-navy-900">Observaciones Técnicas / Enlaces de Repositorio o Panel</label>
                    <textarea rows="2" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} placeholder="Ej. Proyecto Vercel asignado a cliente. Menú validado por WhatsApp." className="w-full form-input p-2 rounded-lg text-xs"></textarea>
                  </div>

                  <div className="pt-4 border-t border-paper-border flex items-center justify-end gap-3">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="btn-outline-navy px-4 py-2 rounded-lg text-xs font-semibold">
                      Cancelar
                    </button>
                    <button type="submit" className="btn-navy px-6 py-2 rounded-lg text-xs font-semibold shadow-md">
                      Guardar Contrato
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
